kind = "web"
previewPath = "/"
title = "RentalHub"
description = "A real equipment rental marketplace for discovering gear, comparing options, managing listings, and preparing rentals for a safe booking lifecycle."
version = "1.0.0"
id = "artifacts/rentalhub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22358

[services.development]
run = "pnpm --filter @workspace/rentalhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rentalhub", "run", "build" ]
serve = "static"
publicDir = "artifacts/rentalhub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22358"
BASE_PATH = "/"
